[project]
name = "claude-plugins-tools"
version = "0.1.0"
description = "Tooling for the claude-plugins marketplace (the cpt command)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["pyyaml>=6.0.3"]

[project.scripts]
cpt = "claude_plugins_tools.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_plugins_tools"]

[tool.hatch.build.targets.wheel.force-include]
"plugins" = "claude_plugins_tools/plugins"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.8"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "PT", "RET", "SIM", "ARG", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG001", "ARG002"]

[tool.ruff.per-file-target-version]
"plugins/**/hooks/*.py" = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --import-mode=importlib"
pythonpath = ["src"]
